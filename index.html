<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Camera Studio</title>

<style>
body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

video {
  width: 100%;
  max-height: 70vh;
  background: black;
  border-radius: 15px;
}

button {
  margin: 7px;
  padding: 13px 18px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

#status {
  margin-top: 15px;
  min-height: 25px;
}
</style>
</head>

<body>

<div class="container">

<h2>📸 Camera Studio</h2>

<video id="preview" autoplay playsinline muted></video>

<br>

<button id="startCamera">📷 Start Camera</button>

<button id="photoBtn">📸 Take Photo</button>

<button id="switchBtn">🔄 Switch Camera</button>

<p id="status"></p>

<canvas id="canvas" style="display:none;"></canvas>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwSzubRgfKRJ65hA3ieMPabu8wiwM2REcvxkcLwntx5yEpQn0MpWFlhCbiHd6MwSbYM/exec";

const video = document.getElementById("preview");
const canvas = document.getElementById("canvas");
const status = document.getElementById("status");

let stream = null;
let facingMode = "user";


// ===============================
// START CAMERA
// ===============================

async function startCamera() {

  try {

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: facingMode
      },
      audio: false
    });

    video.srcObject = stream;

    status.textContent = "✅ Camera ready";

  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ Camera permission/error: " + error.message;
  }
}


// ===============================
// TAKE PHOTO
// ===============================

document.getElementById("photoBtn").addEventListener("click", async () => {

  if (!stream) {
    status.textContent = "⚠️ Pehle Start Camera dabao";
    return;
  }

  if (video.videoWidth === 0 || video.videoHeight === 0) {
    status.textContent = "⚠️ Camera abhi ready nahi hai";
    return;
  }

  try {

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const blob = await new Promise(resolve => {
      canvas.toBlob(
        resolve,
        "image/jpeg",
        0.90
      );
    });

    if (!blob) {
      throw new Error("Photo create nahi hui");
    }

    status.textContent = "⏳ Photo upload ho rahi hai...";

    await uploadFile(
      blob,
      "photo_" + Date.now() + ".jpg"
    );

  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ Photo error: " + error.message;
  }

});


// ===============================
// UPLOAD
// ===============================

async function uploadFile(blob, fileName) {

  const base64 = await blobToBase64(blob);

  const payload = {
    fileName: fileName,
    mimeType: blob.type,
    base64: base64
  };

  try {

    const response = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },

      body: JSON.stringify(payload)

    });

    const text = await response.text();

    console.log("SERVER RESPONSE:", text);

    let result;

    try {
      result = JSON.parse(text);
    } catch {
      throw new Error(
        "Server ne valid response nahi diya"
      );
    }

    if (!result.success) {

      throw new Error(
        result.error || "Upload failed"
      );

    }

    status.textContent =
      "✅ Photo Google Drive me save ho gayi!";

  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ Upload failed: " + error.message;
  }
}


// ===============================
// BLOB → BASE64
// ===============================

function blobToBase64(blob) {

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onloadend = () => {

      const result = reader.result;

      const base64 =
        result.split(",")[1];

      resolve(base64);

    };

    reader.onerror = reject;

    reader.readAsDataURL(blob);

  });

}


// ===============================
// SWITCH CAMERA
// ===============================

document.getElementById("switchBtn")
.addEventListener("click", async () => {

  facingMode =
    facingMode === "user"
      ? "environment"
      : "user";

  await startCamera();

});


// ===============================
// START BUTTON
// ===============================

document.getElementById("startCamera")
.addEventListener(
  "click",
  startCamera
);

</script>

</body>
</html>
