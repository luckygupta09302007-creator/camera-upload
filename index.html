<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Camera Studio</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.app{position:relative;width:100%;height:100dvh;background:#000;overflow:hidden}
#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.mirror{transform:scaleX(-1)}

/* Filters */
.filter-none{filter:none}
.filter-warm{filter:sepia(0.3) saturate(1.4) brightness(1.05)}
.filter-cool{filter:saturate(0.8) brightness(1.1) hue-rotate(15deg)}
.filter-bw{filter:grayscale(1) contrast(1.1)}
.filter-vintage{filter:sepia(0.5) contrast(0.9) brightness(0.95) saturate(1.2)}

/* Permission Screen */
.perm-box{position:fixed;inset:0;background:#0f172a;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;text-align:center;padding:30px;gap:20px}
.perm-box.hidden{display:none}
.perm-icon{font-size:60px}
.perm-box h2{font-size:22px;margin:0}
.perm-box p{font-size:14px;color:#94a3b8;line-height:1.6;max-width:300px;margin:0}
.perm-btn{padding:16px 40px;font-size:16px;font-weight:bold;border:none;border-radius:14px;background:#22c55e;color:#fff;cursor:pointer}
.perm-btn:active{transform:scale(0.96)}

/* Top Bar */
.top-bar{position:absolute;top:0;left:0;right:0;z-index:10;padding:max(18px,env(safe-area-inset-top)) 18px 25px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent)}
.btn-icon{width:44px;height:44px;border:0;border-radius:50%;color:#fff;background:rgba(0,0,0,.4);backdrop-filter:blur(10px);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-icon:active{transform:scale(.9)}
.btn-icon.active{background:rgba(255,200,0,0.4);color:#ffd700}
.title-badge{padding:8px 15px;border-radius:20px;font-size:13px;font-weight:bold;background:rgba(0,0,0,.45);backdrop-filter:blur(10px)}

/* Filters Drawer */
.filter-drawer{position:absolute;bottom:160px;left:0;right:0;z-index:15;display:none;justify-content:center;gap:8px;padding:8px 15px}
.filter-drawer.show{display:flex}
.f-chip{padding:6px 14px;border-radius:20px;border:1.5px solid rgba(255,255,255,0.3);background:rgba(0,0,0,0.5);color:#fff;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.f-chip.active{border-color:#3b82f6;background:rgba(59,130,246,0.4)}

/* Bottom Controls */
.bottom-bar{position:absolute;left:0;right:0;bottom:0;z-index:10;padding:20px 20px max(25px,env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,.35),transparent)}
.controls-grid{display:grid;grid-template-columns:70px 1fr 70px;align-items:center;justify-items:center}
.thumb-prev{width:50px;height:50px;border-radius:10px;overflow:hidden;border:2px solid rgba(255,255,255,.8);background:rgba(255,255,255,.12);display:flex;justify-content:center;align-items:center;cursor:pointer;font-size:18px}
.thumb-prev img{width:100%;height:100%;object-fit:cover}

/* Shutter */
.shutter-btn{width:78px;height:78px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.4);box-shadow:0 0 0 4px rgba(255,255,255,.3);cursor:pointer;transition:.15s}
.shutter-btn:active{transform:scale(.88)}

/* Flip Camera Button */
.flip-btn{width:50px;height:50px;border:0;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(10px);color:#fff;font-size:22px;cursor:pointer}
.flip-btn:active{transform:scale(.9)}

/* Preview Screen */
.preview-modal{position:fixed;inset:0;display:none;background:#000;z-index:100;flex-direction:column}
.preview-modal.show{display:flex}
.preview-img-box{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px}
.preview-img-box img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.preview-top{position:absolute;top:0;left:0;right:0;padding:max(18px,env(safe-area-inset-top)) 18px;z-index:5;display:flex;justify-content:space-between;align-items:center}
.close-btn{width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.preview-actions{padding:15px 20px max(25px,env(safe-area-inset-bottom));display:flex;gap:12px;background:linear-gradient(to top,rgba(0,0,0,0.9),transparent)}
.act-btn{flex:1;height:52px;border:0;border-radius:15px;font-size:15px;font-weight:bold;cursor:pointer;transition:0.2s}
.act-btn:active{transform:scale(.97)}
.btn-retake{color:#fff;background:rgba(255,255,255,.15);backdrop-filter:blur(10px)}
.btn-upload{color:#000;background:#22c55e}

/* Toast */
.toast{position:fixed;left:50%;bottom:125px;transform:translateX(-50%) translateY(20px);padding:12px 18px;border-radius:25px;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:300;white-space:nowrap;border:1px solid rgba(255,255,255,0.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Loader */
.loading-box{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);z-index:500}
.loading-box.show{display:flex}
.spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.2);border-top-color:#22c55e;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(min-width:700px){.app{max-width:500px;margin:auto;box-shadow:0 0 80px rgba(0,0,0,.8)}}
</style>
</head>
<body>

<!-- Permission Prompt -->
<div class="perm-box" id="permBox">
  <div class="perm-icon">📸</div>
  <h2>Camera Studio</h2>
  <p>Live photo khichne aur direct Drive me save karne ke liye Camera allow karein.</p>
  <button class="perm-btn" onclick="startCamera()">✅ Open Camera</button>
</div>

<!-- Main Camera App -->
<div class="app" id="mainApp" style="display:none">
  <video id="camera" autoplay playsinline muted></video>

  <!-- Top Bar -->
  <div class="top-bar">
    <button class="btn-icon" id="filterBtn">🎨</button>
    <div class="title-badge">Camera Mode</div>
    <button class="btn-icon" id="flashBtn">⚡</button>
  </div>

  <!-- Filters Drawer -->
  <div class="filter-drawer" id="filterDrawer">
    <button class="f-chip active" data-filter="none">Normal</button>
    <button class="f-chip" data-filter="warm">☀️ Warm</button>
    <button class="f-chip" data-filter="cool">❄️ Cool</button>
    <button class="f-chip" data-filter="bw">🖤 B&W</button>
    <button class="f-chip" data-filter="vintage">📷 Vintage</button>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <div class="controls-grid">
      <div class="thumb-prev" id="thumbPrev">▣</div>
      <button class="shutter-btn" id="shutterBtn" onclick="takeSnapshot()"></button>
      <button class="flip-btn" id="flipBtn" onclick="toggleFacing()">🔄</button>
    </div>
  </div>
</div>

<!-- Preview Modal -->
<div class="preview-modal" id="previewModal">
  <div class="preview-top">
    <button class="close-btn" onclick="closePreview()">✕</button>
    <div class="title-badge">Preview</div>
  </div>
  <div class="preview-img-box">
    <img id="previewImg" src="">
  </div>
  <div class="preview-actions">
    <button class="act-btn btn-retake" onclick="closePreview()">↩ Retake</button>
    <button class="act-btn btn-upload" id="uploadBtn" onclick="uploadToDrive()">☁ Send to Drive</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Loader -->
<div class="loading-box" id="loadingBox">
  <div class="spinner"></div>
  <div id="loadingText">Uploading to Google Drive...</div>
</div>

<script>
let videoStream = null;
let currentFacing = "user"; // Front Camera Default
let activeFilter = "none";
let capturedBase64 = null;
let isTorchOn = false;

const cameraEl = document.getElementById("camera");
const permBox = document.getElementById("permBox");
const mainApp = document.getElementById("mainApp");
const previewModal = document.getElementById("previewModal");
const previewImg = document.getElementById("previewImg");
const thumbPrev = document.getElementById("thumbPrev");
const filterDrawer = document.getElementById("filterDrawer");
const flashBtn = document.getElementById("flashBtn");
const loadingBox = document.getElementById("loadingBox");
const toastEl = document.getElementById("toast");

/* 1. START CAMERA */
async function startCamera() {
  if (videoStream) {
    videoStream.getTracks().forEach(t => t.stop());
  }
  isTorchOn = false;
  flashBtn.classList.remove("active");

  try {
    videoStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: currentFacing,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    cameraEl.srcObject = videoStream;
    await cameraEl.play();

    cameraEl.classList.toggle("mirror", currentFacing === "user");
    permBox.classList.add("hidden");
    mainApp.style.display = "block";
  } catch (err) {
    console.error(err);
    showToast("❌ Camera permission allow karein!");
  }
}

/* 2. FLIP CAMERA */
async function toggleFacing() {
  currentFacing = (currentFacing === "user") ? "environment" : "user";
  await startCamera();
}

/* 3. FLASH / TORCH */
flashBtn.onclick = async () => {
  if (!videoStream) return;
  const track = videoStream.getVideoTracks()[0];
  if (!track) return;

  try {
    const caps = track.getCapabilities();
    if (!caps.torch) {
      showToast("⚡ Flash is camera me available nahi hai");
      return;
    }
    isTorchOn = !isTorchOn;
    await track.applyConstraints({ advanced: [{ torch: isTorchOn }] });
    flashBtn.classList.toggle("active", isTorchOn);
    showToast(isTorchOn ? "⚡ Flash ON" : "⚡ Flash OFF");
  } catch (e) {
    showToast("⚡ Flash not supported");
  }
};

/* 4. FILTERS */
document.getElementById("filterBtn").onclick = () => {
  filterDrawer.classList.toggle("show");
};

filterDrawer.querySelectorAll(".f-chip").forEach(chip => {
  chip.onclick = () => {
    filterDrawer.querySelectorAll(".f-chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    activeFilter = chip.dataset.filter;

    cameraEl.className = "";
    if (currentFacing === "user") cameraEl.classList.add("mirror");
    cameraEl.classList.add("filter-" + activeFilter);
  };
});

function getFilterCSS(f) {
  switch(f) {
    case "warm": return "sepia(0.3) saturate(1.4) brightness(1.05)";
    case "cool": return "saturate(0.8) brightness(1.1) hue-rotate(15deg)";
    case "bw": return "grayscale(1) contrast(1.1)";
    case "vintage": return "sepia(0.5) contrast(0.9) brightness(0.95) saturate(1.2)";
    default: return "none";
  }
}

/* 5. TAKE PHOTO & COMPRESS (FAST ~150KB) */
function takeSnapshot() {
  if (!cameraEl.videoWidth) {
    showToast("Camera is not ready");
    return;
  }

  const canvas = document.createElement("canvas");
  // Downscale to 1280x720 max for speed
  canvas.width = cameraEl.videoWidth || 1280;
  canvas.height = cameraEl.videoHeight || 720;
  const ctx = canvas.getContext("2d");

  ctx.filter = getFilterCSS(activeFilter);

  if (currentFacing === "user") {
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
  }

  ctx.drawImage(cameraEl, 0, 0, canvas.width, canvas.height);

  // Quality 0.75 gives crisp HD image under 200KB
  capturedBase64 = canvas.toDataURL("image/jpeg", 0.75);

  previewImg.src = capturedBase64;
  thumbPrev.innerHTML = `<img src="${capturedBase64}">`;
  previewModal.classList.add("show");
}

/* 6. PREVIEW CLOSE / RETAKE */
function closePreview() {
  previewModal.classList.remove("show");
  previewImg.src = "";
  capturedBase64 = null;
}

thumbPrev.onclick = () => {
  if (capturedBase64) previewModal.classList.add("show");
};

/* 7. UPLOAD DIRECTLY TO GOOGLE DRIVE (1-2 SECONDS) */
function uploadToDrive() {
  if (!capturedBase64) {
    showToast("No photo to send");
    return;
  }

  const uploadBtn = document.getElementById("uploadBtn");
  const fileName = "photo_" + Date.now() + ".jpg";

  loadingBox.classList.add("show");
  uploadBtn.disabled = true;

  // 15 Second Safety Timeout
  const timer = setTimeout(() => {
    loadingBox.classList.remove("show");
    uploadBtn.disabled = false;
    showToast("❌ Network slow. Please try again.");
  }, 15000);

  google.script.run
    .withSuccessHandler(function(res) {
      clearTimeout(timer);
      loadingBox.classList.remove("show");
      uploadBtn.disabled = false;

      if (res && res.success) {
        showToast(res.msg);
        setTimeout(closePreview, 1200);
      } else {
        showToast(res ? res.msg : "❌ Upload Fail");
      }
    })
    .withFailureHandler(function(err) {
      clearTimeout(timer);
      loadingBox.classList.remove("show");
      uploadBtn.disabled = false;
      showToast("❌ Error: " + err);
    })
    .uploadImageToDrive(capturedBase64, fileName);
}

/* Toast Notification */
let toastTimeout;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toastEl.classList.remove("show"), 3000);
}
</script>
</body>
</html>
