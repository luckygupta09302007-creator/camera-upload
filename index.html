<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Camera Studio Pro</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.app{position:relative;width:100%;height:100dvh;background:#000;overflow:hidden}
#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.mirror{transform:scaleX(-1)}

/* Filters */
.filter-none{filter:none}
.filter-warm{filter:sepia(0.3) saturate(1.4) brightness(1.05)}
.filter-cool{filter:saturate(0.8) brightness(1.1) hue-rotate(15deg)}
.filter-bw{filter:grayscale(1) contrast(1.1)}
.filter-vintage{filter:sepia(0.5) contrast(0.9) brightness(0.95) saturate(1.2)}

/* Permission */
.perm{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;text-align:center;padding:30px;gap:20px}
.perm.hide{display:none}
.perm-icon{font-size:60px}
.perm h2{font-size:22px}
.perm p{font-size:14px;color:#94a3b8;line-height:1.6;max-width:300px}
.perm-btn{padding:16px 40px;font-size:17px;font-weight:bold;border:none;border-radius:14px;background:#22c55e;color:#fff;cursor:pointer}
.perm-btn:active{transform:scale(0.96)}

/* Top */
.top{position:absolute;top:0;left:0;right:0;z-index:10;padding:max(18px,env(safe-area-inset-top)) 18px 25px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent)}
.top-g{display:flex;align-items:center;gap:10px}
.ic{width:44px;height:44px;border:0;border-radius:50%;color:#fff;background:rgba(0,0,0,.4);backdrop-filter:blur(10px);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ic:active{transform:scale(.9)}
.ic.flash-on{background:rgba(255,200,0,0.4);color:#ffd700}
.badge{padding:8px 13px;border-radius:20px;font-size:12px;font-weight:bold;background:rgba(0,0,0,.45);backdrop-filter:blur(10px)}

/* Rec */
.rec{position:absolute;top:85px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:8px;padding:8px 14px;border-radius:20px;background:rgba(0,0,0,.7);z-index:20}
.rec.on{display:flex}
.rd{width:9px;height:9px;border-radius:50%;background:red;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.3}}

/* Filter bar */
.fbar{position:absolute;bottom:185px;left:0;right:0;z-index:15;display:none;justify-content:center;gap:8px;padding:8px 15px}
.fbar.on{display:flex}
.fc{padding:6px 14px;border-radius:20px;border:1.5px solid rgba(255,255,255,0.3);background:rgba(0,0,0,0.5);color:#fff;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.fc.act{border-color:#3b82f6;background:rgba(59,130,246,0.3)}

/* Audio wave */
.aw{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none;align-items:center;gap:4px;z-index:5}
.aw.on{display:flex}
.wb{width:6px;background:#10b981;border-radius:3px;animation:wv 0.8s ease-in-out infinite}
.wb:nth-child(1){height:20px;animation-delay:0s}
.wb:nth-child(2){height:35px;animation-delay:.1s}
.wb:nth-child(3){height:50px;animation-delay:.2s}
.wb:nth-child(4){height:35px;animation-delay:.3s}
.wb:nth-child(5){height:55px;animation-delay:.15s}
.wb:nth-child(6){height:40px;animation-delay:.25s}
.wb:nth-child(7){height:25px;animation-delay:.35s}
.wb:nth-child(8){height:45px;animation-delay:.05s}
@keyframes wv{0%,100%{transform:scaleY(0.5)}50%{transform:scaleY(1.2)}}

/* Bottom */
.bot{position:absolute;left:0;right:0;bottom:0;z-index:10;padding:20px 20px max(25px,env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,.35),transparent)}
.modes{display:flex;justify-content:center;gap:30px;margin-bottom:20px}
.md{border:0;background:none;color:rgba(255,255,255,.45);font-weight:bold;font-size:14px;cursor:pointer;padding:4px 0;position:relative}
.md.act{color:#fff}
.md.act::after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#fff}
.ctr{display:grid;grid-template-columns:70px 1fr 70px;align-items:center;justify-items:center}
.tb{width:50px;height:50px;border-radius:10px;overflow:hidden;border:2px solid rgba(255,255,255,.8);background:rgba(255,255,255,.12);display:flex;justify-content:center;align-items:center;cursor:pointer;font-size:18px}
.tb img,.tb video{width:100%;height:100%;object-fit:cover}
.sh{width:78px;height:78px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.4);box-shadow:0 0 0 4px rgba(255,255,255,.3);cursor:pointer;transition:.15s}
.sh:active{transform:scale(.88)}
.sh.vid{background:#ff3040;border-color:#fff}
.sh.aud{background:#10b981;border-color:#fff}
.sh.isrec{border-radius:18px;transform:scale(.85)}
.sw{width:50px;height:50px;border:0;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(10px);color:#fff;font-size:22px;cursor:pointer}
.sw:active{transform:scale(.9)}

/* Preview */
.pv{position:fixed;inset:0;display:none;background:#000;z-index:100;flex-direction:column}
.pv.on{display:flex}
.pv-c{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.pv-c img,.pv-c video,.pv-c audio{max-width:100%;max-height:100%;object-fit:contain}
.pv-top{position:absolute;top:0;left:0;right:0;padding:max(18px,env(safe-area-inset-top)) 18px;z-index:5;display:flex;justify-content:space-between;align-items:center}
.cl{width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pvb{padding:6px 12px;border-radius:15px;font-size:12px;font-weight:bold;backdrop-filter:blur(10px)}
.pvb-p{background:rgba(59,130,246,0.4)}
.pvb-v{background:rgba(239,68,68,0.4)}
.pvb-a{background:rgba(16,185,129,0.4)}
.pv-acts{padding:15px 20px max(25px,env(safe-area-inset-bottom));display:flex;gap:12px;background:linear-gradient(to top,rgba(0,0,0,0.8),transparent)}
.ab{flex:1;height:52px;border:0;border-radius:15px;font-size:15px;font-weight:bold;cursor:pointer;transition:0.2s}
.ab:active{transform:scale(.97)}
.ab-r{color:#fff;background:rgba(255,255,255,.15);backdrop-filter:blur(10px)}
.ab-s{color:#000;background:#fff}

/* Audio preview */
.apb{display:flex;flex-direction:column;align-items:center;gap:20px;padding:30px}
.api{font-size:80px}
.apl{font-size:16px;color:#94a3b8}

/* Toast */
.tt{position:fixed;left:50%;bottom:125px;transform:translateX(-50%) translateY(20px);padding:12px 18px;border-radius:25px;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:300;white-space:nowrap}
.tt.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* Loader */
.ld{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);z-index:500}
.ld.on{display:flex}
.sp{width:42px;height:42px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sn .8s linear infinite}
@keyframes sn{to{transform:rotate(360deg)}}
.prog{width:200px;height:6px;border-radius:3px;background:rgba(255,255,255,0.15);overflow:hidden}
.prog-fill{height:100%;width:0%;background:#22c55e;border-radius:3px;transition:width 0.3s}

@media(min-width:700px){.app{max-width:500px;margin:auto;box-shadow:0 0 80px rgba(0,0,0,.8)}}
</style>
</head>
<body>

<!-- Permission -->
<div class="perm" id="P">
  <div class="perm-icon">📸</div>
  <h2>Camera & Mic Access</h2>
  <p>Photo, Video aur Audio ke liye Camera aur Microphone allow karein.</p>
  <button class="perm-btn" onclick="grant()">✅ Allow Camera & Mic</button>
</div>

<!-- App -->
<div class="app" id="A" style="display:none">
  <video id="C" autoplay playsinline muted></video>
  
  <div class="aw" id="AW">
    <div class="wb"></div><div class="wb"></div><div class="wb"></div><div class="wb"></div>
    <div class="wb"></div><div class="wb"></div><div class="wb"></div><div class="wb"></div>
  </div>

  <div class="top">
    <div class="top-g">
      <button class="ic" id="FB">🎨</button>
      <div class="badge" id="SB">Photo</div>
    </div>
    <div class="top-g">
      <button class="ic" id="FL">⚡</button>
    </div>
  </div>

  <div class="rec" id="RI"><span class="rd"></span><span id="TT">00:00</span></div>

  <div class="fbar" id="FBR">
    <button class="fc act" data-f="none">Normal</button>
    <button class="fc" data-f="warm">☀️ Warm</button>
    <button class="fc" data-f="cool">❄️ Cool</button>
    <button class="fc" data-f="bw">🖤 B&W</button>
    <button class="fc" data-f="vintage">📷 Vintage</button>
  </div>

  <div class="bot">
    <div class="modes">
      <button class="md act" data-m="photo">PHOTO</button>
      <button class="md" data-m="video">VIDEO</button>
      <button class="md" data-m="audio">AUDIO</button>
    </div>
    <div class="ctr">
      <div class="tb" id="TB">▣</div>
      <button class="sh" id="SH"></button>
      <button class="sw" id="SW">🔄</button>
    </div>
  </div>
</div>

<!-- Preview -->
<div class="pv" id="PV">
  <div class="pv-top">
    <button class="cl" id="CL">✕</button>
    <div class="pvb" id="PVB">📷 Photo</div>
  </div>
  <div class="pv-c" id="PVC"></div>
  <div class="pv-acts">
    <button class="ab ab-r" id="RT">↩ Retake</button>
    <button class="ab ab-s" id="SD">☁ Send to Drive</button>
  </div>
</div>

<!-- Toast -->
<div class="tt" id="TO"></div>

<!-- Loader -->
<div class="ld" id="LD">
  <div class="sp"></div>
  <div id="LT">Sending...</div>
  <div class="prog"><div class="prog-fill" id="PF"></div></div>
</div>

<script>
const C=document.getElementById("C"),
SH=document.getElementById("SH"),
SW=document.getElementById("SW"),
FL=document.getElementById("FL"),
FB=document.getElementById("FB"),
FBR=document.getElementById("FBR"),
SB=document.getElementById("SB"),
RI=document.getElementById("RI"),
TT=document.getElementById("TT"),
AW=document.getElementById("AW"),
TB=document.getElementById("TB"),
PV=document.getElementById("PV"),
PVC=document.getElementById("PVC"),
PVB=document.getElementById("PVB"),
SD=document.getElementById("SD"),
RT=document.getElementById("RT"),
CL=document.getElementById("closePreview")||document.getElementById("CL"),
LD=document.getElementById("LD"),
LT=document.getElementById("LT"),
PF=document.getElementById("PF"),
TO=document.getElementById("TO"),
PM=document.getElementById("P"),
AP=document.getElementById("A");

let st=null,fc="user",md="photo",rec=null,ch=[],blob=null,ct="photo",ti=null,rs=0,fOn=false,cf="none";

// CHUNK SIZE: 200KB
const CHUNK=200000;

/* Permission */
async function grant(){
  try{
    st=await navigator.mediaDevices.getUserMedia({video:{facingMode:fc,width:{ideal:1920},height:{ideal:1080}},audio:true});
    C.srcObject=st;await C.play();
    if(fc==="user")C.classList.add("mirror");
    PM.classList.add("hide");AP.style.display="block";
  }catch(e){
    try{
      st=await navigator.mediaDevices.getUserMedia({video:{facingMode:fc}});
      C.srcObject=st;await C.play();
      if(fc==="user")C.classList.add("mirror");
      PM.classList.add("hide");AP.style.display="block";
      msg("⚠️ Mic not available");
    }catch(err){msg("❌ Permission denied")}
  }
}

/* Camera restart */
async function reCam(){
  if(st)st.getTracks().forEach(t=>t.stop());
  fOn=false;FL.classList.remove("flash-on");
  try{
    st=await navigator.mediaDevices.getUserMedia({video:{facingMode:fc,width:{ideal:1920},height:{ideal:1080}},audio:true});
    C.srcObject=st;await C.play();C.classList.toggle("mirror",fc==="user");
  }catch(e){
    try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:fc}});C.srcObject=st;await C.play();C.classList.toggle("mirror",fc==="user");}
    catch(err){msg("Camera error")}
  }
}

/* Switch */
SW.onclick=async()=>{fc=fc==="user"?"environment":"user";await reCam()};

/* Flash */
FL.onclick=async()=>{
  if(!st)return;
  const vt=st.getVideoTracks()[0];if(!vt)return;
  try{
    const cp=vt.getCapabilities();
    if(!cp.torch){msg("Flash not available");return}
    fOn=!fOn;
    await vt.applyConstraints({advanced:[{torch:fOn}]});
    FL.classList.toggle("flash-on",fOn);
    msg(fOn?"⚡ Flash ON":"⚡ Flash OFF");
  }catch(e){msg("Flash not supported")}
};

/* Filter toggle */
FB.onclick=()=>FBR.classList.toggle("on");
FBR.querySelectorAll(".fc").forEach(c=>{
  c.onclick=()=>{
    FBR.querySelectorAll(".fc").forEach(x=>x.classList.remove("act"));
    c.classList.add("act");cf=c.dataset.f;
    C.className="";if(fc==="user")C.classList.add("mirror");
    C.classList.add("filter-"+cf);
  }
});

/* Mode */
document.querySelectorAll(".md").forEach(b=>{
  b.onclick=()=>{
    if(rec&&rec.state==="recording")return;
    document.querySelectorAll(".md").forEach(x=>x.classList.remove("act"));
    b.classList.add("act");md=b.dataset.m;
    SH.className="sh";
    if(md==="video")SH.classList.add("vid");
    if(md==="audio")SH.classList.add("aud");
    C.style.display=md==="audio"?"none":"block";
    AW.classList.toggle("on",md==="audio");
    SB.textContent=md.charAt(0).toUpperCase()+md.slice(1);
    FBR.classList.remove("on");
  }
});

/* Shutter */
SH.onclick=()=>{
  if(!st)return;
  if(md==="photo")snap();
  else if(md==="video")togVid();
  else togAud();
};

/* Photo */
function snap(){
  if(!C.videoWidth){msg("Camera not ready");return}
  const cv=document.createElement("canvas");
  cv.width=C.videoWidth;cv.height=C.videoHeight;
  const cx=cv.getContext("2d");
  cx.filter=gf(cf);
  if(fc==="user"){cx.translate(cv.width,0);cx.scale(-1,1)}
  cx.drawImage(C,0,0,cv.width,cv.height);
  cv.toBlob(b=>{
    if(!b){msg("Failed");return}
    blob=b;ct="photo";showPV();
  },"image/jpeg",0.85);
}

function gf(f){
  switch(f){
    case"warm":return"sepia(0.3) saturate(1.4) brightness(1.05)";
    case"cool":return"saturate(0.8) brightness(1.1) hue-rotate(15deg)";
    case"bw":return"grayscale(1) contrast(1.1)";
    case"vintage":return"sepia(0.5) contrast(0.9) brightness(0.95) saturate(1.2)";
    default:return"none";
  }
}

/* Video */
function togVid(){
  if(rec&&rec.state==="recording"){
    rec.stop();clearInterval(ti);RI.classList.remove("on");SH.classList.remove("isrec");
  }else{
    ch=[];let m="video/webm";
    if(MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus"))m="video/webm;codecs=vp9,opus";
    else if(MediaRecorder.isTypeSupported("video/webm;codecs=vp8,opus"))m="video/webm;codecs=vp8,opus";
    try{rec=new MediaRecorder(st,{mimeType:m})}catch(e){msg("Not supported");return}
    rec.ondataavailable=e=>{if(e.data.size>0)ch.push(e.data)};
    rec.onstop=()=>{blob=new Blob(ch,{type:m});ct="video";showPV()};
    rec.start(1000);rs=Date.now();RI.classList.add("on");SH.classList.add("isrec");
    ti=setInterval(clk,500);SB.textContent="Recording...";
  }
}

/* Audio */
function togAud(){
  if(rec&&rec.state==="recording"){
    rec.stop();clearInterval(ti);RI.classList.remove("on");SH.classList.remove("isrec");
  }else{
    ch=[];const at=st.getAudioTracks();
    if(!at.length){msg("Mic not found!");return}
    rec=new MediaRecorder(new MediaStream(at));
    rec.ondataavailable=e=>{if(e.data.size>0)ch.push(e.data)};
    rec.onstop=()=>{blob=new Blob(ch,{type:"audio/webm"});ct="audio";showPV()};
    rec.start(1000);rs=Date.now();RI.classList.add("on");SH.classList.add("isrec");
    ti=setInterval(clk,500);SB.textContent="Recording Audio...";
  }
}

/* Clock */
function clk(){
  const s=Math.floor((Date.now()-rs)/1000);
  TT.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  if(s>=300){if(rec&&rec.state==="recording")rec.stop();clearInterval(ti);RI.classList.remove("on");SH.classList.remove("isrec");msg("5 min limit")}
}

/* Preview */
function showPV(){
  PVC.innerHTML="";
  if(ct==="photo"){
    const i=document.createElement("img");i.src=URL.createObjectURL(blob);PVC.appendChild(i);
    PVB.textContent="📷 Photo";PVB.className="pvb pvb-p";
  }else if(ct==="video"){
    const v=document.createElement("video");v.src=URL.createObjectURL(blob);
    v.controls=true;v.autoplay=true;v.playsInline=true;v.style.maxWidth="100%";v.style.maxHeight="100%";
    PVC.appendChild(v);PVB.textContent="🎥 Video";PVB.className="pvb pvb-v";
  }else{
    const bx=document.createElement("div");bx.className="apb";
    bx.innerHTML='<div class="api">🎵</div><div class="apl">Audio Recording</div>';
    const au=document.createElement("audio");au.src=URL.createObjectURL(blob);
    au.controls=true;au.autoplay=true;au.style.width="90%";bx.appendChild(au);
    PVC.appendChild(bx);PVB.textContent="🎙️ Audio";PVB.className="pvb pvb-a";
  }
  updTh();PV.classList.add("on");
}

function updTh(){
  TB.innerHTML="";
  if(ct==="photo"){const i=document.createElement("img");i.src=URL.createObjectURL(blob);TB.appendChild(i)}
  else if(ct==="video"){const v=document.createElement("video");v.src=URL.createObjectURL(blob);v.muted=true;v.playsInline=true;TB.appendChild(v)}
  else TB.innerHTML="🎵";
}

/* Retake */
async function retake(){PV.classList.remove("on");PVC.innerHTML="";blob=null;await reCam();SB.textContent=md.charAt(0).toUpperCase()+md.slice(1)}
RT.onclick=retake;CL.onclick=retake;
TB.onclick=()=>{if(blob)showPV()};

/* ===== CHUNKED UPLOAD TO DRIVE ===== */
SD.onclick=()=>{
  if(!blob){msg("Nothing to send");return}
  
  let ext="jpg",pre="photo_";
  if(ct==="video"){ext="webm";pre="video_"}
  if(ct==="audio"){ext="webm";pre="audio_"}
  const fn=pre+Date.now()+"."+ext;
  
  LT.textContent="Preparing upload...";
  PF.style.width="0%";
  LD.classList.add("on");
  SD.disabled=true;

  const reader=new FileReader();
  reader.onloadend=()=>{
    const b64=reader.result.split(",")[1];
    doChunkedUpload(fn,blob.type,b64);
  };
  reader.readAsDataURL(blob);
};

function doChunkedUpload(fileName,mimeType,b64){
  // Step 1: Start upload session
  LT.textContent="Starting upload...";
  
  google.script.run
    .withSuccessHandler(function(res){
      if(!res.success){
        LD.classList.remove("on");SD.disabled=false;
        msg("❌ "+res.msg);return;
      }
      
      const uploadId=res.uploadId;
      const chunks=[];
      
      // Split base64 into chunks
      for(let i=0;i<b64.length;i+=CHUNK){
        chunks.push(b64.substring(i,i+CHUNK));
      }
      
      const total=chunks.length;
      let sent=0;
      
      LT.textContent="Uploading 0/"+total+" chunks...";
      
      // Send chunks one by one
      function sendNext(){
        if(sent>=total){
          // All chunks sent -> finish
          LT.textContent="Saving to Drive...";
          PF.style.width="95%";
          
          google.script.run
            .withSuccessHandler(function(fRes){
              LD.classList.remove("on");SD.disabled=false;
              PF.style.width="100%";
              if(fRes.success){
                msg(fRes.msg);
                setTimeout(retake,1500);
              }else{
                msg(fRes.msg);
              }
            })
            .withFailureHandler(function(err){
              LD.classList.remove("on");SD.disabled=false;
              msg("❌ Save Error");
            })
            .finishUpload(uploadId,total,mimeType);
          return;
        }
        
        google.script.run
          .withSuccessHandler(function(cRes){
            if(!cRes.success){
              LD.classList.remove("on");SD.disabled=false;
              msg("❌ Chunk error");return;
            }
            sent++;
            const pct=Math.round((sent/total)*90);
            PF.style.width=pct+"%";
            LT.textContent="Uploading "+sent+"/"+total+" chunks...";
            sendNext();
          })
          .withFailureHandler(function(err){
            LD.classList.remove("on");SD.disabled=false;
            msg("❌ Upload Error");
          })
          .uploadChunk(uploadId,sent,chunks[sent]);
      }
      
      sendNext();
    })
    .withFailureHandler(function(err){
      LD.classList.remove("on");SD.disabled=false;
      msg("❌ Start Error");
    })
    .startUpload(fileName);
}

/* Toast */
let tto;
function msg(m){TO.textContent=m;TO.classList.add("on");clearTimeout(tto);tto=setTimeout(()=>TO.classList.remove("on"),3000)}
</script>
</body>
</html>
