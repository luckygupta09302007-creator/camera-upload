<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Camera Studio</title>
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
.app{
  position:relative;
  width:100%;
  height:100dvh;
  background:#000;
  overflow:hidden;
}
#camera{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}
.mirror{
  transform:scaleX(-1);
}

/* PERMISSION OVERLAY */
.perm-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
  text-align:center;
  padding:30px;
  gap:20px;
}
.perm-overlay.hidden{
  display:none;
}
.perm-icon{
  font-size:60px;
}
.perm-title{
  font-size:22px;
  font-weight:bold;
}
.perm-desc{
  font-size:14px;
  color:#94a3b8;
  line-height:1.6;
  max-width:300px;
}
.perm-btn{
  padding:16px 40px;
  font-size:17px;
  font-weight:bold;
  border:none;
  border-radius:14px;
  cursor:pointer;
  transition:0.2s;
}
.perm-allow{
  background:#22c55e;
  color:white;
}
.perm-allow:active{
  transform:scale(0.96);
  background:#16a34a;
}

/* TOP */
.top{
  position:absolute;
  top:0;left:0;right:0;
  z-index:10;
  padding:max(18px,env(safe-area-inset-top)) 18px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent);
}
.top-group{
  display:flex;
  align-items:center;
  gap:10px;
}
.icon{
  width:44px;height:44px;
  border:0;border-radius:50%;
  color:#fff;
  background:rgba(0,0,0,.4);
  backdrop-filter:blur(10px);
  font-size:20px;cursor:pointer;
}
.icon:active{
  transform:scale(.9);
}
.status{
  padding:8px 13px;
  border-radius:20px;
  font-size:12px;font-weight:bold;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(10px);
}

/* RECORDING INDICATOR */
.recording{
  position:absolute;
  top:85px;left:50%;
  transform:translateX(-50%);
  display:none;
  align-items:center;gap:8px;
  padding:8px 14px;border-radius:20px;
  background:rgba(0,0,0,.7);
  z-index:20;
}
.recording.show{
  display:flex;
}
.red-dot{
  width:9px;height:9px;
  border-radius:50%;
  background:red;
  animation:blink 1s infinite;
}
@keyframes blink{
  50%{opacity:.3}
}

/* BOTTOM */
.bottom{
  position:absolute;
  left:0;right:0;bottom:0;
  z-index:10;
  padding:20px 20px max(25px,env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,.35),transparent);
}

/* MODE TABS */
.modes{
  display:flex;
  justify-content:center;
  gap:35px;
  margin-bottom:20px;
}
.mode{
  border:0;background:none;
  color:rgba(255,255,255,.55);
  font-weight:bold;font-size:14px;
  cursor:pointer;
  transition:0.2s;
}
.mode.active{
  color:#fff;
}

/* CONTROLS */
.controls{
  display:grid;
  grid-template-columns:70px 1fr 70px;
  align-items:center;
  justify-items:center;
}

/* THUMBNAIL */
.thumb{
  width:50px;height:50px;
  border-radius:10px;overflow:hidden;
  border:2px solid rgba(255,255,255,.8);
  background:rgba(255,255,255,.12);
  display:flex;justify-content:center;align-items:center;
  cursor:pointer;font-size:18px;
}
.thumb img,.thumb video{
  width:100%;height:100%;object-fit:cover;
}

/* SHUTTER */
.shutter{
  width:78px;height:78px;
  border-radius:50%;
  background:#fff;
  border:5px solid rgba(255,255,255,.4);
  box-shadow:0 0 0 4px rgba(255,255,255,.3);
  cursor:pointer;transition:.15s;
}
.shutter:active{
  transform:scale(.88);
}
.shutter.video-mode{
  background:#ff3040;
  border-color:#fff;
}
.shutter.is-recording{
  border-radius:18px;
  transform:scale(.85);
}

/* SWITCH */
.switch{
  width:50px;height:50px;
  border:0;border-radius:50%;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(10px);
  color:#fff;font-size:22px;
  cursor:pointer;
}
.switch:active{
  transform:scale(.9);
}

/* PREVIEW SCREEN */
.preview{
  position:fixed;inset:0;
  display:none;
  background:#000;
  z-index:100;
}
.preview.show{
  display:block;
}
.preview-media{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
}
#photoPreview,#videoPreview{
  max-width:100%;max-height:100%;object-fit:contain;
}
.preview-top{
  position:absolute;
  top:0;left:0;right:0;
  padding:max(18px,env(safe-area-inset-top)) 18px;
  z-index:5;
}
.close{
  width:44px;height:44px;
  border:0;border-radius:50%;
  background:rgba(0,0,0,.6);
  color:#fff;font-size:22px;
  cursor:pointer;
}
.close:active{
  transform:scale(.9);
}

/* PREVIEW ACTIONS */
.actions{
  position:absolute;
  left:20px;right:20px;
  bottom:max(25px,env(safe-area-inset-bottom));
  display:flex;gap:12px;
  z-index:5;
}
.action{
  flex:1;height:52px;
  border:0;border-radius:15px;
  font-size:15px;font-weight:bold;
  cursor:pointer;transition:0.2s;
}
.retake{
  color:#fff;
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(10px);
}
.send{
  color:#000;
  background:#fff;
}
.action:active{
  transform:scale(.97);
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;bottom:125px;
  transform:translateX(-50%) translateY(20px);
  padding:12px 18px;border-radius:25px;
  background:rgba(0,0,0,.8);
  backdrop-filter:blur(10px);
  font-size:14px;
  opacity:0;pointer-events:none;
  transition:.3s;z-index:300;
  white-space:nowrap;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* LOADER */
.loader{
  position:fixed;inset:0;
  display:none;
  align-items:center;justify-content:center;
  flex-direction:column;gap:15px;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(6px);
  z-index:500;
}
.loader.show{
  display:flex;
}
.spinner{
  width:42px;height:42px;
  border:4px solid rgba(255,255,255,.25);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{
  to{transform:rotate(360deg)}
}

@media(min-width:700px){
  .app{
    max-width:500px;
    margin:auto;
    box-shadow:0 0 80px rgba(0,0,0,.8);
  }
}
</style>
</head>
<body>

<!-- PERMISSION OVERLAY -->
<div class="perm-overlay" id="permOverlay">
  <div class="perm-icon">📸</div>
  <div class="perm-title">Camera & Mic Access</div>
  <div class="perm-desc">
    Photo aur Video capture karne ke liye Camera aur Microphone ki permission deni hogi.<br><br>
    Niche <b>Allow</b> par click karein, phir browser popup me bhi <b>Allow</b> dabayein.
  </div>
  <button class="perm-btn perm-allow" onclick="grantPermission()">✅ Allow Camera & Mic</button>
</div>

<div class="app" id="mainApp" style="display:none;">

  <video id="camera" autoplay playsinline muted></video>

  <!-- TOP -->
  <div class="top">
    <div class="top-group">
      <div class="status" id="status">Camera</div>
    </div>
    <div class="top-group">
      <button class="icon" id="flashBtn">⚡</button>
    </div>
  </div>

  <!-- RECORDING INDICATOR -->
  <div class="recording" id="recording">
    <span class="red-dot"></span>
    <span id="timer">00:00</span>
  </div>

  <!-- BOTTOM -->
  <div class="bottom">
    <div class="modes">
      <button class="mode active" id="photoMode">PHOTO</button>
      <button class="mode" id="videoMode">VIDEO</button>
      <button class="mode" id="audioMode">AUDIO</button>
    </div>
    <div class="controls">
      <div class="thumb" id="thumb">▣</div>
      <button class="shutter" id="shutter"></button>
      <button class="switch" id="switchBtn">🔄</button>
    </div>
  </div>

</div>

<!-- PREVIEW -->
<div class="preview" id="preview">
  <div class="preview-media">
    <img id="photoPreview" style="display:none;">
    <video id="videoPreview" controls playsinline style="display:none;"></video>
  </div>
  <div class="preview-top">
    <button class="close" id="closeBtn">✕</button>
  </div>
  <div class="actions">
    <button class="action retake" id="retakeBtn">↩ Retake</button>
    <button class="action send" id="sendBtn">☁ Send to Drive</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- LOADER -->
<div class="loader" id="loader">
  <div class="spinner"></div>
  <div id="loaderText">Sending...</div>
</div>

<script>
/* ===== ELEMENTS ===== */
const camera = document.getElementById("camera");
const shutter = document.getElementById("shutter");
const photoMode = document.getElementById("photoMode");
const videoMode = document.getElementById("videoMode");
const audioMode = document.getElementById("audioMode");
const switchBtn = document.getElementById("switchBtn");
const statusEl = document.getElementById("status");
const previewEl = document.getElementById("preview");
const photoPreview = document.getElementById("photoPreview");
const videoPreview = document.getElementById("videoPreview");
const sendBtn = document.getElementById("sendBtn");
const retakeBtn = document.getElementById("retakeBtn");
const closeBtn = document.getElementById("closeBtn");
const thumb = document.getElementById("thumb");
const recordingEl = document.getElementById("recording");
const timerEl = document.getElementById("timer");
const loader = document.getElementById("loader");
const loaderText = document.getElementById("loaderText");
const toastEl = document.getElementById("toast");
const permOverlay = document.getElementById("permOverlay");
const mainApp = document.getElementById("mainApp");

/* ===== STATE ===== */
let stream = null;
let facingMode = "user";
let mode = "photo"; // photo | video | audio
let mediaRecorder = null;
let chunks = [];
let capturedBlob = null;
let timerInterval = null;
let recordingStart = 0;

/* ===== PERMISSION ===== */
async function grantPermission() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: true
    });
    camera.srcObject = stream;
    await camera.play();
    if (facingMode === "user") camera.classList.add("mirror");
    
    permOverlay.classList.add("hidden");
    mainApp.style.display = "block";
    statusEl.textContent = "Photo";
  } catch (err) {
    // Try without audio
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } });
      camera.srcObject = stream;
      await camera.play();
      if (facingMode === "user") camera.classList.add("mirror");
      
      permOverlay.classList.add("hidden");
      mainApp.style.display = "block";
      statusEl.textContent = "Photo (No Mic)";
    } catch (e) {
      showToast("❌ Camera permission allow karein!");
    }
  }
}

/* ===== CAMERA RESTART ===== */
async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: true
    });
    camera.srcObject = stream;
    await camera.play();
    camera.classList.toggle("mirror", facingMode === "user");
  } catch (err) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } });
      camera.srcObject = stream;
      await camera.play();
      camera.classList.toggle("mirror", facingMode === "user");
    } catch (e) {
      showToast("Camera error!");
    }
  }
}

/* ===== MODE SWITCHING ===== */
photoMode.onclick = () => {
  if (mediaRecorder && mediaRecorder.state === "recording") return;
  mode = "photo";
  photoMode.classList.add("active");
  videoMode.classList.remove("active");
  audioMode.classList.remove("active");
  shutter.classList.remove("video-mode");
  shutter.style.background = "#fff";
  statusEl.textContent = "Photo";
  camera.style.display = "block";
};

videoMode.onclick = () => {
  if (mediaRecorder && mediaRecorder.state === "recording") return;
  mode = "video";
  videoMode.classList.add("active");
  photoMode.classList.remove("active");
  audioMode.classList.remove("active");
  shutter.classList.add("video-mode");
  shutter.style.background = "#ff3040";
  statusEl.textContent = "Video";
  camera.style.display = "block";
};

audioMode.onclick = () => {
  if (mediaRecorder && mediaRecorder.state === "recording") return;
  mode = "audio";
  audioMode.classList.add("active");
  photoMode.classList.remove("active");
  videoMode.classList.remove("active");
  shutter.classList.add("video-mode");
  shutter.style.background = "#10b981";
  statusEl.textContent = "Audio";
  camera.style.display = "none";
};

/* ===== SHUTTER ===== */
shutter.onclick = () => {
  if (!stream) return;
  if (mode === "photo") takePhoto();
  else if (mode === "video") toggleVideoRecording();
  else if (mode === "audio") toggleAudioRecording();
};

/* ===== PHOTO ===== */
function takePhoto() {
  if (camera.videoWidth === 0) { showToast("Camera not ready"); return; }
  
  const canvas = document.createElement("canvas");
  canvas.width = camera.videoWidth;
  canvas.height = camera.videoHeight;
  const ctx = canvas.getContext("2d");
  
  if (facingMode === "user") {
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(camera, 0, 0, canvas.width, canvas.height);
  
  canvas.toBlob(blob => {
    if (!blob) { showToast("Capture failed"); return; }
    capturedBlob = blob;
    photoPreview.src = URL.createObjectURL(blob);
    photoPreview.style.display = "block";
    videoPreview.style.display = "none";
    previewEl.classList.add("show");
    updateThumb(blob, false);
  }, "image/jpeg", 0.85);
}

/* ===== VIDEO RECORDING ===== */
function toggleVideoRecording() {
  if (mediaRecorder && mediaRecorder.state === "recording") {
    mediaRecorder.stop();
    clearInterval(timerInterval);
    recordingEl.classList.remove("show");
    shutter.classList.remove("is-recording");
  } else {
    chunks = [];
    let mime = "video/webm";
    if (MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")) mime = "video/webm;codecs=vp9,opus";
    else if (MediaRecorder.isTypeSupported("video/webm;codecs=vp8,opus")) mime = "video/webm;codecs=vp8,opus";
    
    try {
      mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
    } catch (e) { showToast("Recording not supported"); return; }
    
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = () => {
      capturedBlob = new Blob(chunks, { type: mime });
      videoPreview.src = URL.createObjectURL(capturedBlob);
      videoPreview.style.display = "block";
      photoPreview.style.display = "none";
      previewEl.classList.add("show");
      updateThumb(capturedBlob, true);
    };
    
    mediaRecorder.start(1000);
    recordingStart = Date.now();
    recordingEl.classList.add("show");
    shutter.classList.add("is-recording");
    timerInterval = setInterval(updateTimer, 500);
    statusEl.textContent = "Recording...";
  }
}

/* ===== AUDIO RECORDING ===== */
function toggleAudioRecording() {
  if (mediaRecorder && mediaRecorder.state === "recording") {
    mediaRecorder.stop();
    clearInterval(timerInterval);
    recordingEl.classList.remove("show");
    shutter.classList.remove("is-recording");
  } else {
    chunks = [];
    const audioTracks = stream.getAudioTracks();
    if (audioTracks.length === 0) { showToast("Mic not found!"); return; }
    
    const audioStream = new MediaStream(audioTracks);
    mediaRecorder = new MediaRecorder(audioStream);
    
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = () => {
      capturedBlob = new Blob(chunks, { type: "audio/webm" });
      // Audio ke liye photo preview me waveform text dikhao
      photoPreview.src = "";
      photoPreview.style.display = "none";
      videoPreview.src = URL.createObjectURL(capturedBlob);
      videoPreview.style.display = "block";
      previewEl.classList.add("show");
    };
    
    mediaRecorder.start(1000);
    recordingStart = Date.now();
    recordingEl.classList.add("show");
    shutter.classList.add("is-recording");
    timerInterval = setInterval(updateTimer, 500);
    statusEl.textContent = "Recording Audio...";
  }
}

/* ===== TIMER ===== */
function updateTimer() {
  const sec = Math.floor((Date.now() - recordingStart) / 1000);
  const m = String(Math.floor(sec / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  timerEl.textContent = m + ":" + s;
  if (sec >= 300) {
    if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
    clearInterval(timerInterval);
    recordingEl.classList.remove("show");
    shutter.classList.remove("is-recording");
    showToast("5 min limit reached");
  }
}

/* ===== THUMBNAIL ===== */
function updateThumb(blob, isVideo) {
  thumb.innerHTML = "";
  const url = URL.createObjectURL(blob);
  if (!isVideo) {
    const img = document.createElement("img");
    img.src = url;
    thumb.appendChild(img);
  } else {
    const vid = document.createElement("video");
    vid.src = url;
    vid.muted = true;
    vid.playsInline = true;
    thumb.appendChild(vid);
  }
}

/* ===== SEND TO DRIVE (google.script.run) ===== */
sendBtn.onclick = () => {
  if (!capturedBlob) { showToast("Nothing to send"); return; }
  
  const isVideo = capturedBlob.type.includes("video");
  const isAudio = capturedBlob.type.includes("audio");
  
  let ext = "jpg";
  let prefix = "photo_";
  if (isVideo) { ext = "webm"; prefix = "video_"; }
  if (isAudio) { ext = "webm"; prefix = "audio_"; }
  
  const fileName = prefix + Date.now() + "." + ext;
  
  loaderText.textContent = "Sending to Google Drive...";
  loader.classList.add("show");
  sendBtn.disabled = true;
  
  const reader = new FileReader();
  reader.onloadend = () => {
    const base64Full = reader.result;
    const base64Clean = base64Full.split(",")[1];
    
    google.script.run
      .withSuccessHandler(result => {
        loader.classList.remove("show");
        sendBtn.disabled = false;
        if (result && result.success) {
          showToast(result.msg);
        } else {
          showToast(result ? result.msg : "Upload failed");
        }
      })
      .withFailureHandler(err => {
        loader.classList.remove("show");
        sendBtn.disabled = false;
        showToast("❌ Upload Error: " + err);
      })
      .uploadFile(fileName, capturedBlob.type, base64Clean);
  };
  reader.readAsDataURL(capturedBlob);
};

/* ===== RETAKE ===== */
async function retake() {
  previewEl.classList.remove("show");
  photoPreview.src = "";
  videoPreview.pause();
  videoPreview.src = "";
  capturedBlob = null;
  await startCamera();
  statusEl.textContent = mode === "photo" ? "Photo" : mode === "video" ? "Video" : "Audio";
}

retakeBtn.onclick = retake;
closeBtn.onclick = retake;

/* ===== SWITCH CAMERA ===== */
switchBtn.onclick = async () => {
  facingMode = facingMode === "user" ? "environment" : "user";
  await startCamera();
};

/* ===== TOAST ===== */
let toastTimeout;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toastEl.classList.remove("show"), 2800);
}
</script>
</body>
</html>
