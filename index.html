<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Camera Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 700px;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      color: #bbb;
    }

    video {
      width: 100%;
      max-height: 70vh;
      margin-top: 20px;
      background: black;
      border-radius: 18px;
      object-fit: cover;
    }

    button {
      margin-top: 20px;
      padding: 15px 24px;
      border: none;
      border-radius: 12px;
      background: #2196f3;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    #status {
      margin-top: 18px;
      color: #ddd;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>📷 Camera Studio</h1>

    <p>
      Camera aur microphone use karne ke liye
      neeche button dabayein.
    </p>

    <button id="allowButton">
      📷 Allow Camera & Microphone
    </button>

    <video id="camera" autoplay muted playsinline></video>

    <div id="status">
      Permission ka wait ho raha hai...
    </div>

  </div>

  <script>

    const allowButton = document.getElementById("allowButton");
    const camera = document.getElementById("camera");
    const status = document.getElementById("status");

    let stream = null;

    allowButton.addEventListener("click", async () => {

      try {

        status.textContent =
          "Camera aur microphone permission maangi ja rahi hai...";

        stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true
        });

        camera.srcObject = stream;

        status.textContent =
          "✅ Camera aur microphone successfully allowed!";

        allowButton.style.display = "none";

      } catch (error) {

        console.error(error);

        status.textContent =
          "❌ Permission denied: " +
          error.name;

      }

    });

  </script>

</body>
</html>
