<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0e27">
    <meta name="description" content="Professional Camera Studio - Take high-quality photos and videos with advanced controls">
    <meta name="color-scheme" content="dark">
    <title>Camera Studio - Professional Photo & Video Capture</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23667eea'/><circle cx='50' cy='50' r='30' fill='none' stroke='%23fff' stroke-width='4'/></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app" role="main">
        <!-- Permission Screen -->
        <div id="permissionScreen" class="permission-screen" role="banner">
            <div class="permission-wrapper">
                <div class="permission-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="80" height="80">
                        <path d="M12 2C8.14 2 5 5.14 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.86-3.14-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="currentColor"/>
                    </svg>
                </div>
                <h1 class="permission-title">Camera Studio</h1>
                <p class="permission-text">Professional photo and video capture with advanced camera controls</p>
                <p class="permission-subtitle">High-quality images • Real-time effects • Seamless sharing</p>
                <button class="btn btn-primary btn-lg" id="openCameraBtn" aria-label="Open camera and grant permissions">
                    <span class="btn-icon">🎥</span>
                    Open Camera
                </button>
                <p class="permission-note">We need camera access to capture photos and videos</p>
            </div>
        </div>

        <!-- Camera Container -->
        <div id="cameraContainer" class="camera-container" aria-label="Camera preview area">
            <video id="video" class="camera-video" playsinline autoplay muted></video>
            <div class="grid-overlay" id="gridOverlay" aria-hidden="true"></div>
            <div class="focus-ring" id="focusRing" aria-hidden="true"></div>

            <!-- Recording Indicator -->
            <div class="recording-indicator" id="recordingIndicator" role="status" aria-live="polite">
                <div class="recording-dot" aria-hidden="true"></div>
                <span class="recording-time" id="recordingTime">00:00</span>
            </div>

            <!-- Top Controls -->
            <div class="top-controls">
                <div class="control-group">
                    <button class="btn-icon-sm" id="flashBtn" aria-label="Toggle flash" title="Flash">
                        <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z" fill="currentColor"/></svg>
                    </button>
                    <button class="btn-icon-sm" id="gridBtn" aria-label="Toggle grid overlay" title="Grid">
                        <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z" fill="currentColor"/></svg>
                    </button>
                </div>
                <div class="control-group">
                    <button class="btn-icon-sm" id="timerBtn" aria-label="Timer" title="Timer">
                        <svg viewBox="0 0 24 24"><path d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.41-1.41c-.63-.9-1.48-1.65-2.43-2.12l-1.07 1.85c.73.4 1.38.95 1.9 1.61zM4.07 6.39L2.66 4.98c-.9.63-1.65 1.48-2.12 2.43l1.85 1.07c.4-.73.95-1.38 1.61-1.9z" fill="currentColor"/></svg>
                    </button>
                    <button class="btn-icon-sm" id="settingsBtn" aria-label="Settings" title="Settings">
                        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.62l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.48.1.62l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.62l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.62l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" fill="currentColor"/></svg>
                    </button>
                </div>
            </div>

            <!-- Stop Recording Button -->
            <button class="btn btn-danger" id="stopRecordingBtn" aria-label="Stop recording">
                STOP RECORDING
            </button>

            <!-- Bottom Controls -->
            <div class="bottom-controls">
                <!-- Mode Selector -->
                <div class="mode-selector">
                    <button class="mode-btn active" data-mode="photo" id="photoModeBtn" aria-label="Switch to photo mode" role="tab">PHOTO</button>
                    <button class="mode-btn" data-mode="video" id="videoModeBtn" aria-label="Switch to video mode" role="tab">VIDEO</button>
                </div>

                <!-- Capture Controls -->
                <div class="capture-controls">
                    <div class="thumbnail-container hidden" id="thumbnailContainer" role="button" aria-label="View last capture" tabindex="0">
                        <img id="thumbnailImage" style="display: none;" alt="Last photo">
                        <video id="thumbnailVideo" style="display: none;" muted></video>
                        <div class="thumbnail-video-indicator" id="thumbnailVideoIndicator" style="display: none;" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
                        </div>
                    </div>
                    <button class="shutter-btn" id="shutterBtn" aria-label="Capture photo or start recording"></button>
                    <button class="btn-icon-sm" id="cameraSwitchBtn" aria-label="Switch between front and back camera" title="Switch Camera">
                        <svg viewBox="0 0 24 24"><path d="M20 4h-3.17L15 2H9L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 12c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z" fill="currentColor"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Photo Preview -->
        <div class="preview-screen" id="photoPreview">
            <div class="preview-media-container">
                <img class="preview-image" id="previewImage" alt="Captured photo">
                <button class="preview-close-btn" id="photoPreviewCloseBtn" aria-label="Close preview">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/></svg>
                </button>
            </div>
            <div class="preview-controls">
                <div class="preview-info" id="photoInfo"></div>
                <div class="preview-actions">
                    <button class="btn btn-secondary" id="photoRetakeBtn">
                        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" fill="currentColor"/></svg>
                        Retake
                    </button>
                    <button class="btn btn-secondary" id="photoDownloadBtn">
                        <svg viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2z" fill="currentColor"/></svg>
                        Download
                    </button>
                    <button class="btn btn-primary" id="photoSendBtn">
                        <svg viewBox="0 0 24 24"><path d="M16.6915026,12.4744748 L3.50612381,13.2599618 C3.19218622,13.2599618 3.03521743,13.4170592 3.03521743,13.5741566 L1.15159189,20.0151496 C0.8376543,20.8006365 0.99,21.89 1.77946707,22.52 C2.41,22.99 3.50612381,23.1 4.13399899,22.9429026 L21.714504,14.0454487 C22.6563168,13.5741566 23.1272231,12.6315722 22.6563168,11.6889879 L4.13399899,1.68449156 C3.50612381,1.3131994 2.40999899,1.42431024 1.77946707,1.89597751 C0.994623095,2.52459768 0.837654326,3.61542819 1.15159189,4.40091508 L3.03521743,10.8418081 C3.03521743,11.1131002 3.34915502,11.2701975 3.50612381,11.2701975 L16.6915026,12.0556844 C16.6915026,12.0556844 17.1624089,12.0556844 17.1624089,11.5873722 L17.1624089,12.6315722 C17.1624089,12.0556844 17.1624089,12.4744748 16.6915026,12.4744748 Z" fill="currentColor"/></svg>
                        Send to Drive
                    </button>
                </div>
            </div>
        </div>

        <!-- Video Preview -->
        <div class="preview-screen" id="videoPreview">
            <div class="preview-media-container">
                <video class="preview-video" id="previewVideo" playsinline controls></video>
                <button class="preview-close-btn" id="videoPreviewCloseBtn" aria-label="Close preview">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/></svg>
                </button>
            </div>
            <div class="preview-controls">
                <div class="preview-info" id="videoInfo"></div>
                <div class="preview-actions">
                    <button class="btn btn-secondary" id="videoRetakeBtn">
                        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" fill="currentColor"/></svg>
                        Retake
                    </button>
                    <button class="btn btn-secondary" id="videoDownloadBtn">
                        <svg viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2z" fill="currentColor"/></svg>
                        Download
                    </button>
                    <button class="btn btn-primary" id="videoSendBtn">
                        <svg viewBox="0 0 24 24"><path d="M16.6915026,12.4744748 L3.50612381,13.2599618 C3.19218622,13.2599618 3.03521743,13.4170592 3.03521743,13.5741566 L1.15159189,20.0151496 C0.8376543,20.8006365 0.99,21.89 1.77946707,22.52 C2.41,22.99 3.50612381,23.1 4.13399899,22.9429026 L21.714504,14.0454487 C22.6563168,13.5741566 23.1272231,12.6315722 22.6563168,11.6889879 L4.13399899,1.68449156 C3.50612381,1.3131994 2.40999899,1.42431024 1.77946707,1.89597751 C0.994623095,2.52459768 0.837654326,3.61542819 1.15159189,4.40091508 L3.03521743,10.8418081 C3.03521743,11.1131002 3.34915502,11.2701975 3.50612381,11.2701975 L16.6915026,12.0556844 C16.6915026,12.0556844 17.1624089,12.0556844 17.1624089,11.5873722 L17.1624089,12.6315722 C17.1624089,12.0556844 17.1624089,12.4744748 16.6915026,12.4744748 Z" fill="currentColor"/></svg>
                        Send to Drive
                    </button>
                </div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div class="modal" id="settingsModal" role="dialog" aria-labelledby="settingsTitle">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="settingsTitle">Settings</h2>
                    <button class="btn-icon-sm" id="settingsCloseBtn" aria-label="Close settings">
                        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/></svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="settings-group">
                        <label for="qualitySlider" class="setting-label">Photo Quality</label>
                        <input type="range" id="qualitySlider" class="slider" min="0.3" max="1" step="0.1" value="0.95" aria-label="Photo quality">
                        <span id="qualityValue">95%</span>
                    </div>
                    <div class="settings-group">
                        <label for="resolutionSelect" class="setting-label">Video Resolution</label>
                        <select id="resolutionSelect" class="select-input" aria-label="Video resolution">
                            <option value="720">720p</option>
                            <option value="1080" selected>1080p</option>
                            <option value="2160">2160p (4K)</option>
                        </select>
                    </div>
                    <div class="settings-group">
                        <label for="volumeSlider" class="setting-label">Shutter Sound Volume</label>
                        <input type="range" id="volumeSlider" class="slider" min="0" max="1" step="0.1" value="0.7" aria-label="Shutter sound volume">
                    </div>
                </div>
            </div>
        </div>

        <!-- Toast Notifications -->
        <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay" role="status" aria-live="polite">
            <div class="spinner" aria-hidden="true"></div>
            <div class="loading-text" id="loadingText">Processing...</div>
        </div>

        <!-- Error Modal -->
        <div class="modal" id="errorModal" role="alertdialog" aria-labelledby="errorTitle">
            <div class="modal-content error">
                <div class="modal-header">
                    <h2 id="errorTitle">Error</h2>
                    <button class="btn-icon-sm" id="errorCloseBtn" aria-label="Close error">
                        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/></svg>
                    </button>
                </div>
                <div class="modal-body">
                    <p id="errorMessage"></p>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" id="errorDismissBtn">Dismiss</button>
                </div>
            </div>
        </div>
    </div>

    <noscript>
        <div style="padding: 2rem; text-align: center; background: #1a1a2e; color: #fff;">
            <p>Camera Studio requires JavaScript to be enabled. Please enable JavaScript in your browser settings.</p>
        </div>
    </noscript>

    <script src="app.js" defer></script>
</body>
</html>
